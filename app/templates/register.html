{% extends "base.html" %}
{% block title %}Register Admin{% endblock %}

{% block content %}
<div class="page-center">
    <div class="narrow-card">
        <div class="card">
            <h3 class="text-center">Register Admin</h3>

            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" value="{{ username or '' }}" autofocus data-validate="username">
                    <div class="form-hint">Letters, digits, underscore — min 3 characters.</div>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="password-field-wrap">
                        <input type="password" id="registerPasswordInput" name="password" class="form-control" data-validate="password">
                        <button type="button" id="registerPasswordToggle" class="password-toggle-btn" title="Show password" tabindex="-1">👁</button>
                    </div>
                    <div class="form-hint">Min 8 characters, with a letter, a digit, and a special character.</div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Register</button>
            </form>

            <p class="text-center text-muted mt-2">
                Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
