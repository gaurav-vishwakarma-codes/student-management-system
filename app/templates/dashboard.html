{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="page-center">
    <div class="narrow-card" style="max-width: 480px;">
        <h2 class="text-center mb-3">Student Management System</h2>

        <div class="btn-stack">

            <form method="POST" action="{{ url_for('student.load_dummy_data') }}">
                <button type="submit" class="btn btn-outline btn-block">Load Dummy Data</button>
            </form>

            <a href="{{ url_for('student.add_student') }}" class="btn btn-outline btn-block">Add Student</a>
            <a href="{{ url_for('student.view_students') }}" class="btn btn-outline btn-block">View Students</a>
            <a href="{{ url_for('student.search_student') }}" class="btn btn-outline btn-block">Search Student</a>
            <a href="{{ url_for('student.update_student_search') }}" class="btn btn-outline btn-block">Update Student</a>
            <a href="{{ url_for('student.delete_student_search') }}" class="btn btn-outline btn-block">Delete Student</a>
            <a href="{{ url_for('history.updated_history') }}" class="btn btn-secondary btn-block">Updated Students History</a>
            <a href="{{ url_for('history.deleted_history') }}" class="btn btn-secondary btn-block">Deleted Students History</a>

        </div>
    </div>
</div>
{% endblock %}
