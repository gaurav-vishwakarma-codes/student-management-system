{% extends "base.html" %}
{% block title %}Add Student{% endblock %}

{% block content %}
<div class="page-center">
    <div class="narrow-card" style="max-width: 520px;">
        <div class="card">
            <h3>Add Student</h3>

            <form method="POST" action="{{ url_for('student.add_student') }}">

                <div class="form-group">
                    <label class="form-label">Roll Number</label>
                    <input type="text" name="roll_no" class="form-control" value="{{ roll_no or '' }}" data-validate="roll_no">
                </div>

                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="full_name" class="form-control" value="{{ full_name or '' }}" data-validate="full_name">
                </div>

                <div class="form-group">
                    <label class="form-label">Age</label>
                    <input type="text" name="age" class="form-control" value="{{ age or '' }}" data-validate="age">
                </div>

                <div class="form-group">
                    <label class="form-label">Gender</label>
                    <input type="text" name="gender" class="form-control" value="{{ gender or '' }}" placeholder="Male / Female / Other" data-validate="gender">
                </div>

                <div class="form-group">
                    <label class="form-label">Course</label>
                    <input type="text" name="course" class="form-control" value="{{ course or '' }}" data-validate="course">
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="text" name="email" class="form-control" value="{{ email or '' }}" data-validate="email">
                </div>

                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="text" name="phone" class="form-control" value="{{ phone or '' }}" data-validate="phone">
                </div>

                <div class="form-group">
                    <label class="form-label">Address</label>
                    <input type="text" name="address" class="form-control" value="{{ address or '' }}" data-validate="address">
                </div>

                <button type="submit" class="btn btn-primary btn-block">Add Student</button>

            </form>
        </div>
    </div>
</div>
{% endblock %}
