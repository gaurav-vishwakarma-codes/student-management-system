{% extends "base.html" %}
{% block title %}Welcome — Student Management System{% endblock %}

{% block content %}
<div class="page-center">
    <div class="narrow-card">
        <div class="card text-center">
            <h2 class="mb-3">🎓 Student Management System</h2>

            <p class="text-muted mb-1">Already have an account?</p>
            <a href="{{ url_for('auth.login') }}" class="btn btn-primary btn-block mb-3">Login</a>

            <p class="text-muted mb-1">New admin?</p>
            <a href="{{ url_for('auth.register') }}" class="btn btn-secondary btn-block">Register</a>
        </div>
    </div>
</div>
{% endblock %}
